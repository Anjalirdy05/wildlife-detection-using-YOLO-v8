version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://wildeye:password@postgres:5432/wildeye_db
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://mongo:27017/wildeye
    depends_on:
      - postgres
      - redis
      - mongo
    volumes:
      - ./backend:/app
      - yolo_models:/app/models

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wildeye_db
      POSTGRES_USER: wildeye
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
  yolo_models:
